<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Загрузка файла</title>
    <style>
        /* Стили для центрирования кнопки на странице */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        /* Скрываем стандартный инпут и стилизуем кнопку */
        .upload-btn {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background 0.2s;
        }
        .upload-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <!-- Скрытый инпут для выбора файла -->
    <input type="file" id="fileInput" style="display: none;" onchange="checkFile(this)">
    
    <!-- Красивая кнопка, которая активирует выбор файла -->
    <button class="upload-btn" onclick="document.getElementById('fileInput').click()">Загрузить файл</button>

    <script>
        function checkFile(input) {
            // Проверяем, что файл действительно выбран
            if (input.files.length > 0) {
                const fileName = input.files[0].name;

                if (fileName === 'script.cpp') {
                    // Перенаправление на нужную страницу (замените URL на свой)
                    window.location.href = 'plan/planpay';
                } else {
                    // Вызов модального окна, если имя не совпадает
                    alert('Ваш индикатор не найден');
                    // Сбрасываем значение инпута, чтобы можно было выбрать файл заново
                    input.value = '';
                }
            }
        }
    </script>

</body>
</html>
