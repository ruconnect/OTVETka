<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подмосковье сегодня</title>
    <style>
        :root {
            --primary-color: #2e7d32; /* Основной зеленый */
            --primary-hover: #1b5e20; /* Темно-зеленый при наведении */
            --bg-color: #f4f6f4;      /* Светлый фон */
            --text-color: #333333;    /* Цвет текста */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Центрированный контейнер для главного экрана */
        .welcome-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        header h1 {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 2.5rem;
        }

        /* Главная кнопка перехода */
        .main-btn {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            padding: 18px 36px;
            font-size: 1.25rem;
            font-weight: bold;
            border-radius: 50px; /* Округлая форма */
            box-shadow: 0 4px 15px rgba(46, 125, 50, 0.3);
            transition: all 0.3s ease;
        }

        .main-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px); /* Эффект приподнимания */
            box-shadow: 0 6px 20px rgba(27, 94, 32, 0.4);
        }

        .main-btn:active {
            transform: translateY(0);
        }

        footer {
            background-color: #222;
            color: #ccc;
            text-align: center;
            padding: 1.5rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="welcome-container">
        <header>
            <h1>Подмосковье сегодня</h1>
            <p>Новости про Подмосковье</p>
        </header>

        <!-- Единственная кнопка перехода на страницу новостей -->
        <a href="plan.html" class="main-btn">Смотреть новости</a>
        <a href="https://beta-otvetka.vercel.app/" class="main-btn">Бета версия сайта</a>
        <a href="port.html" class="main-btn">О этом сайте</a>
        <a href="live.html" class="main-btn">Новое Вельяминово live</a>
    </div>

    <footer>
        <p>&copy; ОТВЕТка</p>
    </footer>

</body>
<script>
  // Этот код меняет путь в адресной строке без перезагрузки страницы
  window.history.pushState({}, '', '/plan');
</script>
</html>
