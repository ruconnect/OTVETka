<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новое Вельяминово live</title>
    <style>
        /* Обнуляем отступы и растягиваем страницу на весь экран */
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Зелёный квадрат по центру с адаптивностью */
        .green-box {
            width: 100%;
            max-width: 600px;
            min-height: 400px;
            background-color: #2ed573;
            box-sizing: border-box;
            padding: 30px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        /* Контейнер для видео */
        .video-container {
            flex: 1;
            width: 100%;
        }

        .video-container video {
            width: 100%;
            height: auto;
            border-radius: 6px;
            display: block;
        }

        /* Контейнер для текста */
        .text-container {
            flex: 1;
            color: #ffffff;
            font-size: 16px;
            line-height: 1.5;
        }

        /* Адаптивность для мобильных устройств (экраны менее 600px) */
        @media (max-width: 600px) {
            .green-box {
                flex-direction: column;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="green-box">
        <!-- Блок с видео -->
        <div class="video-container">
            <video controls muted autoplay loop playsinline>
                <source src="video/1.mp4" type="video/mp4">
                Ошибка live режима! Видео не загружается
            </video>
        </div>

        <!-- Блок с текстом -->
        <div class="text-container">
            <h3>Электричество</h3>
            <p>
                Отключение электричества в посёлке
            </p>
        </div>
    </div>

<script src="live.js" defer></script>
</body>
</html>
