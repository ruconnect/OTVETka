<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background: #f2f2f2;
        }

        header {
            background: #6aff00;
            color: white;
            padding: 20px;
            font-size: 28px;
            font-weight: bold;
        }

        main {
            margin-top: 80px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background: #48ff00;
            color: white;
        }

        button:disabled {
            background: #777;
            cursor: not-allowed;
        }

        #timer {
            margin-top: 30px;
            font-size: 24px;
            color: #000000;
        }

        .progress-container {
            width: 80%;
            max-width: 500px;
            height: 25px;
            background: #ddd;
            border-radius: 20px;
            margin: 30px auto;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #007bff;
            transition: width 1s linear;
        }

        .slider-container {
            width: 80%;
            max-width: 500px;
            margin: 20px auto;
            display: none;
        }

        .slider-container input[type="range"] {
            width: 100%;
            height: 8px;
            -webkit-appearance: none;
            background: #ddd;
            outline: none;
            border-radius: 4px;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #48ff00;
            cursor: pointer;
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #48ff00;
            cursor: pointer;
            border: none;
        }

        .slider-label {
            margin-top: 10px;
            font-size: 16px;
            color: #555;
        }
    </style>
</head>
<body>

    <header>
        Новости
    </header>

    <main>
        <button id="startButton">Перейти к новостям</button>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="slider-container" id="sliderContainer">
            <input type="range" id="slider" min="0" max="100" value="0">
            <div class="slider-label" id="sliderLabel">Перетащите ползунок вправо</div>
        </div>

        <div id="timer">
            Нажмите кнопку для загрузки новостей
        </div>
    </main>

    <script>
        window.history.pushState({}, '', '/plan');
        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        const button = document.getElementById("startButton");
        const timerText = document.getElementById("timer");
        const progressContainer = document.getElementById("progressContainer");
        const progressBar = document.getElementById("progressBar");
        const sliderContainer = document.getElementById("sliderContainer");
        const slider = document.getElementById("slider");
        const sliderLabel = document.getElementById("sliderLabel");

        let secondsLeft = 0;
        let totalSeconds = 0;
        let timerInterval = null;
        let sliderCompleted = false;

        button.addEventListener("click", function() {
            // Генерируем случайное время ожидания
            secondsLeft = getRandomInt(8, 180);
            totalSeconds = secondsLeft;

            // Активируем интерфейс
            button.disabled = true;
            progressContainer.style.display = "block";
            sliderContainer.style.display = "block";
            timerText.textContent = "Осталось секунд: " + secondsLeft;
            progressBar.style.width = "0%";

            // Сбрасываем флаг завершения слайдера
            sliderCompleted = false;
            slider.value = "0";
            sliderLabel.textContent = "Перетащите ползунок вправо";

            // Запускаем таймер
            timerInterval = setInterval(function() {
                secondsLeft--;

                const progress = ((totalSeconds - secondsLeft) / totalSeconds) * 100;
                progressBar.style.width = progress + "%";
                timerText.textContent = "Подождите: " + secondsLeft + " с";

                // Проверяем, можно ли перейти
                if (secondsLeft <= 0 && sliderCompleted) {
                    finish();
                } else if (secondsLeft <= 0) {
                    // Таймер закончился, но слайдер не дотянут — меняем подсказку
                    sliderLabel.textContent = "Теперь перетащите ползунок до конца";
                }
            }, 1000);

            // Обработчик слайдера
            slider.addEventListener("input", function() {
                if (slider.value === "100") {
                    sliderCompleted = true;
                    sliderLabel.textContent = "Готово! Ожидайте окончания таймера...";
                    // Если уже прошло время — сразу завершаем
                    if (secondsLeft <= 0) {
                        finish();
                    }
                } else {
                    sliderCompleted = false;
                    if (secondsLeft > 0) {
                        sliderLabel.textContent = "Перетащите ползунок вправо";
                    }
                }
            });
        });

        function finish() {
            clearInterval(timerInterval);
            progressBar.style.width = "100%";
            timerText.textContent = "Загрузка завершена!";
            sliderLabel.textContent = "Переход...";
            
            // Через 1 секунду переходим
            setTimeout(() => {
                window.location.href = "new.html";
            }, 1000);
        }
    </script>
</body>
</html>
