<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background: #f2f2f2;
        }

        header {
            background: #6aff00;
            color: white;
            padding: 20px;
            font-size: 28px;
            font-weight: bold;
        }

        main {
            margin-top: 80px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background: #48ff00;
            color: white;
        }

        button:disabled {
            background: #777;
            cursor: not-allowed;
        }

        #timer {
            margin-top: 30px;
            font-size: 24px;
            color: #000000;
        }

        .progress-container {
            width: 80%;
            max-width: 500px;
            height: 25px;
            background: #ddd;
            border-radius: 20px;
            margin: 30px auto;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #007bff;
            transition: width 1s linear;
        }
    </style>
</head>
<body>

    <header>
        Новости
    </header>

    <main>
        <button id="startButton">Перейти к новостям</button>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div id="timer">
            Нажмите кнопу для загрузки новостей
        </div>
    </main>

    <script>
        function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }
        const button = document.getElementById("startButton");
        const timerText = document.getElementById("timer");
        const progressContainer = document.getElementById("progressContainer");
        const progressBar = document.getElementById("progressBar");

        button.addEventListener("click", function() {
            let secondsLeft = getRandomInt(8,180);
            const totalSeconds = getRandomInt(8,180);

            button.disabled = true;
            progressContainer.style.display = "block";
            timerText.textContent = "Осталось секунд: " + secondsLeft;
            progressBar.style.width = "0%";

            const timer = setInterval(function() {
                secondsLeft--;

                const progress = ((totalSeconds - secondsLeft) / totalSeconds) * 100;
                progressBar.style.width = progress + "%";
                timerText.textContent = "Подождите";

                if (secondsLeft <= 0) {
                    clearInterval(timer);
                    progressBar.style.width = "100%";
                    timerText.textContent = "Страница";

                    window.location.href = "new.html";
                }
            }, 1000);
        });
    </script>

</body>
</html>
